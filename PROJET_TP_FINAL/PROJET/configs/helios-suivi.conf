# /etc/zabbix/zabbix_agent2.d/helios-suivi.conf — sondes du portail de suivi (executees en zabbix)
# Code HTTP de etat.json (attendu 200 ; 000 si le portail ne repond pas)
UserParameter=helios.suivi.http,curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1:8080/etat.json
# Age de etat.json en secondes (attendu < 300) ; stat ne demande que le droit x sur les repertoires
UserParameter=helios.suivi.age,t=$(stat -c %Y /srv/helios/suivi/www/etat.json) && echo $(( $(date +%s) - t ))
