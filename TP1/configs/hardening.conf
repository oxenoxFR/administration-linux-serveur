# /etc/systemd/system/helios-collect.service.d/hardening.conf
# Durcissement ajoute APRES la mesure du score initial (systemd-analyze security).
# Drop-in separe de override.conf : l'unit d'origine n'est jamais modifiee.
[Service]
# --- Noyau, peripheriques, horloge ---
PrivateDevices=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
# Cache les processus des autres utilisateurs dans /proc.
# Surtout PAS ProcSubset=pid : le collecteur lit /proc/loadavg et /proc/meminfo.
ProtectProc=invisible

# --- Utilisateurs, IPC, namespaces ---
PrivateUsers=yes
RemoveIPC=yes
RestrictNamespaces=yes

# --- Execution ---
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictRealtime=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM

# --- Reseau : uniquement les familles utiles a un collecteur ---
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6

# Fichiers crees en 0640 / dossiers en 0750
UMask=0027
